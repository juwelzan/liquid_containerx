name: liquid_glass_container
description: "A production-grade iOS Liquid Glass design system and rendering engine for Flutter with shader-driven refraction, dynamic edge lighting, spring physics, and multi-platform fallbacks."
version: 1.0.0
homepage: https://github.com/juwelzan/liquid_containerx

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  liquid_glass_renderer: ^0.2.0-dev.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:


  shaders:
    - shaders/liquid_glass.frag
    - shaders/liquid_blob.frag
